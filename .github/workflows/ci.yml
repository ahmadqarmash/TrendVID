name: CI

on:
  push:
    branches: [main, v4]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Build guides, syntax, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build guides (fails on invalid front matter)
        run: npm run build

      - name: Syntax check
        run: npm run check

      - name: Tests (offline, includes the ads/YouTube-policy guard)
        run: npm test

      - name: Guard - no secrets committed
        run: |
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules -E 'AIza[0-9A-Za-z_-]{30,}' . ; then
            echo "A Google API key appears to be committed. Remove it and rotate the key."
            exit 1
          fi
