name: Deploy API Worker

# The static site deploys automatically through Cloudflare Pages' Git integration
# (see docs/DEPLOYMENT.md). This workflow only publishes the API Worker.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests must pass before deploying
        run: npm test

      - name: Publish Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy
          # Secrets live in Cloudflare, never in the repo:
          #   npx wrangler secret put YOUTUBE_API_KEY --config api/wrangler.toml
